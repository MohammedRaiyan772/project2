apiVersion : apps/v1
kind : Deployment
metadata : 
 name : deploy100
spec : 
   replicas : 3
   selector :
     matchLabels :  
        city : blr
   strategy :
     type : RollingUpdate
     rollingUpdate : 
       maxUnavailable : 0
       maxSurge : 1
   minReadySeconds : 10
   template : 
    metadata : 
     labels :
       city : blr
    spec : 
     containers :
       - name : web1
         image : raiyan100/devops:ecommerce-frontend-v1
         ports :
           - containerPort : 80
---
apiVersion : v1
kind : Service
metadata : 
 name : service1
spec : 
 selector :
   city : blr 
 type : NodePort
 ports : 
  - protocol : TCP
    port : 80
    targetPort : 80
    nodePort : 30100
