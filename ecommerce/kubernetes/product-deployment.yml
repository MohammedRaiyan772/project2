apiVersion: apps/v1
kind: Deployment

metadata:
  name: product
  namespace: ecommerce
  labels:
    app: product

spec:
  replicas: 2

  selector:
    matchLabels:
      app: product

  template:
    metadata:
      labels:
        app: product

    spec:
      containers:
        - name: product
          image: raiyan100/devops:ecommerce-product-v1
          ports:
            - containerPort: 5000
              name: http
