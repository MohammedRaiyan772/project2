apiVersion: v1
kind: Service

metadata:
  name: ecommerce-stateful
  namespace: ecommerce

spec:
  clusterIP: None

  selector:
    app: ecommerce-stateful

  ports:
    - name: http
      port: 80
      targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ecommerce-ingress
  namespace: ecommerce

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
